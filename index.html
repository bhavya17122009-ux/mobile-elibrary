<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>College Barcode Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <header>
        <h1>GTU E-Library Portal</h1>
        <nav>
            <button class="nav-btn" onclick="showPage('student')">Issue Book</button>
            <button class="nav-btn" onclick="showPage('admin')">Librarian View</button>
        </nav>
    </header>

    <main>
        <section id="studentPage" class="page">
            <div class="card">
                <h2>Scan ID Barcode</h2>
                <div id="reader"></div>
                <div class="info-box">
                    <p><strong>Student ID:</strong> <span id="studentID">Scan barcode...</span></p>
                    <input type="text" id="bookTitle" placeholder="Enter Book Name">
                    <button class="btn-primary" onclick="requestBook()">Submit Request</button>
                </div>
            </div>
        </section>

        <section id="adminPage" class="page" style="display:none;">
            <div class="card">
                <h2>Pending Collections</h2>
                <div class="table-container">
                    <table id="adminTable">
                        <thead>
                            <tr>
                                <th>ID Number</th>
                                <th>Book Name</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="issueList"></tbody>
                    </table>
                </div>
                <button class="btn-danger" onclick="clearData()">Clear All Records</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
